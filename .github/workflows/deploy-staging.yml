name: Deploy to staging (dev.vietstays.com)

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run "php artisan migrate --force" after deploy'
        type: boolean
        default: true
      run_seed:
        description: 'Also run "php artisan db:seed --force" (staging only — resets cities/buildings/users to the legacy sample data)'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_mysql, gd, intl, zip, curl
          coverage: none

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Deploy files over rsync/SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: >-
            -avzr --no-perms --no-owner --no-group
            --exclude=.git
            --exclude=.github
            --exclude=.env
            --exclude=.env.*
            --exclude=node_modules
            --exclude=old
            --exclude=tests
            --exclude=deploy
            --exclude=sftp-config.json
            --exclude=storage
            --exclude=public/uploads
            --exclude=public/hot
          path: ./
          remote_path: ${{ secrets.SG_STAGING_DEPLOY_PATH }}
          remote_host: ${{ secrets.SG_SSH_HOST }}
          remote_port: ${{ secrets.SG_SSH_PORT }}
          remote_user: ${{ secrets.SG_SSH_USER }}
          remote_key: ${{ secrets.SG_SSH_PRIVATE_KEY }}

      - name: Migrate / seed + cache
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SG_SSH_HOST }}
          port: ${{ secrets.SG_SSH_PORT }}
          username: ${{ secrets.SG_SSH_USER }}
          key: ${{ secrets.SG_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.SG_STAGING_DEPLOY_PATH }}"

            # First deploy only: the app skeleton needs these to exist —
            # harmless no-ops once they're already there.
            mkdir -p storage/framework/cache/data storage/framework/sessions \
                     storage/framework/views storage/framework/testing \
                     storage/logs storage/app/public bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            php artisan config:clear
            php artisan route:clear
            php artisan view:clear

            if [ "${{ inputs.run_migrations }}" = "true" ]; then
              php artisan migrate --force
            fi

            if [ "${{ inputs.run_seed }}" = "true" ]; then
              php artisan db:seed --force
            fi

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link || true
