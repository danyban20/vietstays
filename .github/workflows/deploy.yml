name: Deploy to SiteGround

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run "php artisan migrate --force" after deploy'
        type: boolean
        default: true

# Never let two production deploys rsync/migrate on top of each other; a
# second dispatch waits for the first instead of cancelling it mid-migration.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    # Production only ships from main — dispatching from any other branch
    # skips both jobs.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_mysql, gd, intl, zip, curl
          coverage: none

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Enter maintenance mode
        id: down
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SG_SSH_HOST }}
          port: ${{ secrets.SG_SSH_PORT }}
          username: ${{ secrets.SG_SSH_USER }}
          key: ${{ secrets.SG_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.SG_DEPLOY_PATH }}"
            # Visitors get a 503 instead of new code running against the old
            # schema while files sync and migrations run.
            php artisan down --retry=60

      - name: Deploy files over rsync/SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: >-
            -avzr --no-perms --no-owner --no-group
            --exclude=.git
            --exclude=.github
            --exclude=.env
            --exclude=.env.*
            --exclude=node_modules
            --exclude=old
            --exclude=tests
            --exclude=deploy
            --exclude=sftp-config.json
            --exclude=public/hot
            --exclude=storage
            --exclude=public/uploads
          path: ./
          remote_path: ${{ secrets.SG_DEPLOY_PATH }}
          remote_host: ${{ secrets.SG_SSH_HOST }}
          remote_port: ${{ secrets.SG_SSH_PORT }}
          remote_user: ${{ secrets.SG_SSH_USER }}
          remote_key: ${{ secrets.SG_SSH_PRIVATE_KEY }}

      - name: Backup database, then migrate + cache
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SG_SSH_HOST }}
          port: ${{ secrets.SG_SSH_PORT }}
          username: ${{ secrets.SG_SSH_USER }}
          key: ${{ secrets.SG_SSH_PRIVATE_KEY }}
          script: |
            set -eo pipefail
            cd "${{ secrets.SG_DEPLOY_PATH }}"

            php artisan config:clear
            php artisan route:clear
            php artisan view:clear

            if [ "${{ inputs.run_migrations }}" = "true" ]; then
              # Dump the live database before touching schema, so a bad
              # migration can be rolled back by hand without digging through
              # binlogs. Kept outside public_html so it's never served or
              # wiped by the next rsync.
              BACKUP_DIR="$HOME/db-backups"
              mkdir -p "$BACKUP_DIR"

              # Read a key from .env, stripping one pair of surrounding quotes
              # (DB_PASSWORD="..." is valid dotenv but mysqldump would get the
              # quotes as part of the password).
              env_get() {
                { grep -E "^$1=" .env || true; } | tail -1 | cut -d '=' -f2- | sed -E "s/^([\"'])(.*)\1\$/\2/"
              }
              DB_DATABASE=$(env_get DB_DATABASE)
              DB_USERNAME=$(env_get DB_USERNAME)
              DB_HOST=$(env_get DB_HOST)

              STAMP=$(date +%Y%m%d-%H%M%S)
              BACKUP_FILE="$BACKUP_DIR/pre-deploy-$STAMP.sql.gz"

              # pipefail makes a mysqldump failure abort the deploy instead of
              # gzip happily writing an empty backup. MYSQL_PWD keeps the
              # password out of the process list. --no-tablespaces: shared
              # hosting users lack the PROCESS privilege mysqldump 8 wants.
              MYSQL_PWD="$(env_get DB_PASSWORD)" mysqldump \
                -h"${DB_HOST:-127.0.0.1}" -u"$DB_USERNAME" \
                --single-transaction --no-tablespaces \
                "$DB_DATABASE" | gzip > "$BACKUP_FILE"

              # An empty database still dumps a header, so a tiny file means
              # something went wrong even if every command exited 0.
              if [ "$(gzip -dc "$BACKUP_FILE" | head -c 1024 | wc -c)" -lt 1024 ]; then
                echo "Backup $BACKUP_FILE looks empty; refusing to migrate." >&2
                exit 1
              fi
              echo "Database backed up to $BACKUP_FILE"

              # Keep the 10 most recent backups only.
              ls -1t "$BACKUP_DIR"/pre-deploy-*.sql.gz | tail -n +11 | xargs -r rm --

              php artisan migrate --force
            fi

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

      # Runs even if a step above failed, so a broken deploy doesn't leave the
      # site stuck on the 503 page; only skipped if we never went down.
      - name: Leave maintenance mode
        if: always() && steps.down.outcome == 'success'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SG_SSH_HOST }}
          port: ${{ secrets.SG_SSH_PORT }}
          username: ${{ secrets.SG_SSH_USER }}
          key: ${{ secrets.SG_SSH_PRIVATE_KEY }}
          script: |
            cd "${{ secrets.SG_DEPLOY_PATH }}"
            php artisan up
